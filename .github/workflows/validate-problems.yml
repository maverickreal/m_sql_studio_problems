name: Validate Problems

on:
  push:
    branches: [main]
    paths:
      - 'problems/**/*.yaml'
      - 'datasets/**'
      - 'schemas/problem-v1.json'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'problems/**/*.yaml'
      - 'datasets/**'
      - 'schemas/problem-v1.json'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate datasets
        run: npm run validate:datasets

      - name: Validate all problem YAML files
        run: npm run validate

  # Optional: runnable test executor (Postgres integration)
  test-executor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: problems_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run test executor (Postgres)
        run: node scripts/test-executor.mjs
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/problems_test
