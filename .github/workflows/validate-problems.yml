name: Validate Problems

on:
  push:
    branches: [main, dev]
    paths:
      - 'problems/**/*.yaml'
      - 'datasets/**'
      - 'schemas/problem-v1.json'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    branches: [main, dev]
    paths:
      - 'problems/**/*.yaml'
      - 'datasets/**'
      - 'schemas/problem-v1.json'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test

      - name: Validate datasets
        run: bun run validate:datasets

      - name: Validate all problem YAML files
        run: bun run validate

  # Optional: runnable test executor (Postgres integration)
  test-executor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: problems_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test executor (Postgres)
        run: bun run scripts/test-executor.mjs
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/problems_test
