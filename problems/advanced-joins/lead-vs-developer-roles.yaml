id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f72"
slug: "lead-vs-developer-roles"
title: "Project Leads vs Developers"
description: |
  Find all projects where the Lead role has more developers assigned than any other single role. Show project name and the count of developers.
difficulty: hard
mode: read
category: advanced-joins
datasets:
  - hr
sampleInput:
  - "projects(id, name, dept_id, budget)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "project_name | developer_count\n---|---\nData Pipeline | 2\nMobile App | 1\nCRM Integration | 1\nBrand Campaign | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT p.name AS project_name,
    COUNT(*) FILTER (WHERE ep.role = 'Developer') AS developer_count
  FROM projects p
  JOIN employee_projects ep ON p.id = ep.project_id
  GROUP BY p.id, p.name
  HAVING COUNT(*) FILTER (WHERE ep.role = 'Lead') > 0
     AND COUNT(*) FILTER (WHERE ep.role = 'Developer') >= ALL (
       SELECT COUNT(*) FILTER (WHERE ep2.role = r)
       FROM employee_projects ep2
       WHERE ep2.project_id = p.id
         AND ep2.role != 'Lead'
       GROUP BY ep2.role
     )
  ORDER BY developer_count DESC, project_name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT p.name AS project_name,
        COUNT(*) FILTER (WHERE ep.role = 'Developer') AS developer_count
      FROM projects p
      JOIN employee_projects ep ON p.id = ep.project_id
      GROUP BY p.id, p.name
      HAVING COUNT(*) FILTER (WHERE ep.role = 'Lead') > 0
         AND COUNT(*) FILTER (WHERE ep.role = 'Developer') >= ALL (
           SELECT COUNT(*) FILTER (WHERE ep2.role = r)
           FROM employee_projects ep2
           WHERE ep2.project_id = p.id
             AND ep2.role != 'Lead'
           GROUP BY ep2.role
         )
      ORDER BY developer_count DESC, project_name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Data Pipeline', 2),
        ('Mobile App', 1),
        ('CRM Integration', 1),
        ('Brand Campaign', 1)
    ) expected(project_name, developer_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
