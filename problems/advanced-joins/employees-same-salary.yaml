id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f7c"
slug: "employees-same-salary"
title: "Employees Sharing Same Salary"
description: |
  Find pairs of employees who have the exact same salary. Return both names and the shared salary. Each pair should appear only once.
difficulty: medium
mode: read
category: advanced-joins
datasets:
  - hr
sampleInput:
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name1 | name2 | salary\n---|---|---"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT e1.name AS name1, e2.name AS name2, e1.salary
  FROM employees e1
  JOIN employees e2 ON e1.salary = e2.salary AND e1.id < e2.id
  ORDER BY e1.salary, e1.name, e2.name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e1.name AS name1, e2.name AS name2, e1.salary
      FROM employees e1
      JOIN employees e2 ON e1.salary = e2.salary AND e1.id < e2.id
      ORDER BY e1.salary, e1.name, e2.name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
    ) expected(name1, name2, salary)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
