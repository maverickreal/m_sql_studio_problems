id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f71"
slug: "running-salary-total"
title: "Running Salary Total by Department"
description: |
  Show each employee with a running total of salaries in their department, ordered by hire date.
difficulty: medium
mode: read
category: window-functions
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | dept_name | hire_date | salary | running_total\n---|---|---|---|---\nAlice Chen | Engineering | 2020-01-15 | 150000 | 150000\nBob Smith | Engineering | 2021-03-22 | 120000 | 270000\nCarol Davis | Engineering | 2021-06-10 | 130000 | 400000\nDavid Wilson | Sales | 2019-11-05 | 110000 | 110000\nEva Martinez | Sales | 2022-02-14 | 95000 | 205000\nFrank Brown | Sales | 2022-08-30 | 105000 | 310000\nGrace Lee | Marketing | 2021-04-18 | 100000 | 100000\nHenry Taylor | Marketing | 2023-01-12 | 85000 | 185000\nIris Anderson | HR | 2020-09-03 | 90000 | 90000"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT e.name, d.name AS dept_name, e.hire_date, e.salary,
    SUM(e.salary) OVER (PARTITION BY e.dept_id ORDER BY e.hire_date ROWS UNBOUNDED PRECEDING) AS running_total
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  ORDER BY d.name, e.hire_date;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e.name, d.name AS dept_name, e.hire_date, e.salary,
        SUM(e.salary) OVER (PARTITION BY e.dept_id ORDER BY e.hire_date ROWS UNBOUNDED PRECEDING) AS running_total
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      ORDER BY d.name, e.hire_date
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Alice Chen', 'Engineering', '2020-01-15', 150000, 150000),
        ('Bob Smith', 'Engineering', '2021-03-22', 120000, 270000),
        ('Carol Davis', 'Engineering', '2021-06-10', 130000, 400000),
        ('David Wilson', 'Sales', '2019-11-05', 110000, 110000),
        ('Eva Martinez', 'Sales', '2022-02-14', 95000, 205000),
        ('Frank Brown', 'Sales', '2022-08-30', 105000, 310000),
        ('Grace Lee', 'Marketing', '2021-04-18', 100000, 100000),
        ('Henry Taylor', 'Marketing', '2023-01-12', 85000, 185000),
        ('Iris Anderson', 'HR', '2020-09-03', 90000, 90000)
    ) expected(name, dept_name, hire_date, salary, running_total)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
