id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f85"
slug: "dept-highest-budget-project"
title: "Department's Highest Budget Project"
description: |
  For each department, find the project with the highest budget. Return department name, project name, and budget.
difficulty: medium
mode: read
category: window-functions
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "projects(id, name, dept_id, budget)"
sampleOutput: "dept_name | project_name | budget\n---|---|---|---\nEngineering | Data Pipeline | 500000\nSales | CRM Integration | 200000\nMarketing | Brand Campaign | 150000"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT dept_name, project_name, budget
  FROM (
    SELECT d.name AS dept_name, p.name AS project_name, p.budget,
      RANK() OVER (PARTITION BY d.id ORDER BY p.budget DESC) AS budget_rank
    FROM projects p
    JOIN departments d ON p.dept_id = d.id
  ) ranked
  WHERE budget_rank = 1
  ORDER BY budget DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT dept_name, project_name, budget
      FROM (
        SELECT d.name AS dept_name, p.name AS project_name, p.budget,
          RANK() OVER (PARTITION BY d.id ORDER BY p.budget DESC) AS budget_rank
        FROM projects p
        JOIN departments d ON p.dept_id = d.id
      ) ranked
      WHERE budget_rank = 1
      ORDER BY budget DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 'Data Pipeline', 500000),
        ('Sales', 'CRM Integration', 200000),
        ('Marketing', 'Brand Campaign', 150000)
    ) expected(dept_name, project_name, budget)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
