id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f70"
slug: "salary-rank-by-dept"
title: "Salary Rank Within Department"
description: |
  Rank employees by salary within each department using DENSE_RANK. Show name, department, salary, and rank.
difficulty: medium
mode: read
category: window-functions
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | dept_name | salary | salary_rank\n---|---|---|---\nAlice Chen | Engineering | 150000 | 1\nCarol Davis | Engineering | 130000 | 2\nBob Smith | Engineering | 120000 | 3\nDavid Wilson | Sales | 110000 | 1\nFrank Brown | Sales | 105000 | 2\nEva Martinez | Sales | 95000 | 3\nGrace Lee | Marketing | 100000 | 1\nHenry Taylor | Marketing | 85000 | 2\nIris Anderson | HR | 90000 | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT e.name, d.name AS dept_name, e.salary,
    DENSE_RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS salary_rank
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  ORDER BY d.name, salary_rank;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e.name, d.name AS dept_name, e.salary,
        DENSE_RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS salary_rank
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      ORDER BY d.name, salary_rank
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Alice Chen', 'Engineering', 150000, 1),
        ('Carol Davis', 'Engineering', 130000, 2),
        ('Bob Smith', 'Engineering', 120000, 3),
        ('David Wilson', 'Sales', 110000, 1),
        ('Frank Brown', 'Sales', 105000, 2),
        ('Eva Martinez', 'Sales', 95000, 3),
        ('Grace Lee', 'Marketing', 100000, 1),
        ('Henry Taylor', 'Marketing', 85000, 2),
        ('Iris Anderson', 'HR', 90000, 1)
    ) expected(name, dept_name, salary, salary_rank)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
