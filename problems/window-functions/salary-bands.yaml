id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f80"
slug: "salary-bands"
title: "Employee Salary Bands"
description: |
  Categorize employees into salary bands: Low (< 100000), Medium (100000-120000), High (> 120000). Count employees in each band.
difficulty: easy
mode: read
category: window-functions
datasets:
  - hr
sampleInput:
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "salary_band | employee_count\n---|---\nLow | 3\nMedium | 3\nHigh | 3"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT 
    CASE 
      WHEN salary < 100000 THEN 'Low'
      WHEN salary <= 120000 THEN 'Medium'
      ELSE 'High'
    END AS salary_band,
    COUNT(*) AS employee_count
  FROM employees
  GROUP BY 
    CASE 
      WHEN salary < 100000 THEN 'Low'
      WHEN salary <= 120000 THEN 'Medium'
      ELSE 'High'
    END
  ORDER BY 
    CASE salary_band 
      WHEN 'Low' THEN 1 
      WHEN 'Medium' THEN 2 
      ELSE 3 
    END;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT 
        CASE 
          WHEN salary < 100000 THEN 'Low'
          WHEN salary <= 120000 THEN 'Medium'
          ELSE 'High'
        END AS salary_band,
        COUNT(*) AS employee_count
      FROM employees
      GROUP BY 
        CASE 
          WHEN salary < 100000 THEN 'Low'
          WHEN salary <= 120000 THEN 'Medium'
          ELSE 'High'
        END
      ORDER BY 
        CASE salary_band 
          WHEN 'Low' THEN 1 
          WHEN 'Medium' THEN 2 
          ELSE 3 
        END
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Low', 3),
        ('Medium', 3),
        ('High', 3)
    ) expected(salary_band, employee_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
