id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f7a"
slug: "salary-percentile"
title: "Employees Above 75th Percentile Salary"
description: |
  Find employees whose salary is above the 75th percentile within their department using window functions.
difficulty: hard
mode: read
category: window-functions
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | dept_name | salary | percentile_75\n---|---|---|---\nAlice Chen | Engineering | 150000 | 140000\nGrace Lee | Marketing | 100000 | 96250\nDavid Wilson | Sales | 110000 | 107500"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  WITH dept_p75 AS (
    SELECT dept_id,
      PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY salary) AS percentile_75
    FROM employees
    GROUP BY dept_id
  )
  SELECT e.name, d.name AS dept_name, e.salary, p.percentile_75
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  JOIN dept_p75 p ON e.dept_id = p.dept_id
  WHERE e.salary > p.percentile_75
  ORDER BY dept_name, e.salary DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      WITH dept_p75 AS (
        SELECT dept_id,
          PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY salary) AS percentile_75
        FROM employees
        GROUP BY dept_id
      )
      SELECT e.name, d.name AS dept_name, e.salary, p.percentile_75
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      JOIN dept_p75 p ON e.dept_id = p.dept_id
      WHERE e.salary > p.percentile_75
      ORDER BY dept_name, e.salary DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Alice Chen', 'Engineering', 150000, 140000),
        ('Grace Lee', 'Marketing', 100000, 96250),
        ('David Wilson', 'Sales', 110000, 107500)
    ) expected(name, dept_name, salary, percentile_75)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
