id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f7a"
slug: "salary-percentile"
title: "Employees Above 75th Percentile Salary"
description: |
  Find employees whose salary is above the 75th percentile within their department using window functions.
difficulty: hard
mode: read
category: window-functions
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | dept_name | salary | percentile_75\n---|---|---|---\nAlice Chen | Engineering | 150000 | 135000\nDavid Wilson | Sales | 110000 | 105000"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  WITH salary_percentiles AS (
    SELECT e.name, d.name AS dept_name, e.salary,
      PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY e.salary) OVER (PARTITION BY e.dept_id) AS percentile_75
    FROM employees e
    JOIN departments d ON e.dept_id = d.id
  )
  SELECT name, dept_name, salary, percentile_75
  FROM salary_percentiles
  WHERE salary > percentile_75
  ORDER BY dept_name, salary DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      WITH salary_percentiles AS (
        SELECT e.name, d.name AS dept_name, e.salary,
          PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY e.salary) OVER (PARTITION BY e.dept_id) AS percentile_75
        FROM employees e
        JOIN departments d ON e.dept_id = d.id
      )
      SELECT name, dept_name, salary, percentile_75
      FROM salary_percentiles
      WHERE salary > percentile_75
      ORDER BY dept_name, salary DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Alice Chen', 'Engineering', 150000, 135000),
        ('David Wilson', 'Sales', 110000, 105000)
    ) expected(name, dept_name, salary, percentile_75)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
