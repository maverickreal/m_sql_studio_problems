solutionSql: |
  SELECT dept_id, name, hire_date,
    ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY hire_date) AS seniority_rank
  FROM employees ORDER BY dept_id, seniority_rank;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT dept_id, name, hire_date,
        ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY hire_date) AS seniority_rank
      FROM employees ORDER BY dept_id, seniority_rank
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      (1, 'Alice Chen', '2020-01-15', 1), (1, 'Bob Smith', '2021-03-22', 2), (1, 'Carol Davis', '2021-06-10', 3),
      (2, 'David Wilson', '2019-11-05', 1), (2, 'Eva Martinez', '2022-02-14', 2), (2, 'Frank Brown', '2022-08-30', 3),
      (3, 'Grace Lee', '2021-04-18', 1), (3, 'Henry Taylor', '2023-01-12', 2),
      (4, 'Iris Anderson', '2020-09-03', 1)
    ) expected(dept_id, name, hire_date, seniority_rank)
  ) THEN 1 ELSE 0 END AS correct;
