solutionSql: |
  SELECT e1.dept_id, e1.name AS higher_paid, e2.name AS lower_paid, ABS(e1.salary - e2.salary) AS salary_gap
  FROM employees e1 JOIN employees e2 ON e1.dept_id = e2.dept_id AND e1.id < e2.id
  ORDER BY salary_gap DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e1.dept_id, e1.name AS higher_paid, e2.name AS lower_paid, ABS(e1.salary - e2.salary) AS salary_gap
      FROM employees e1 JOIN employees e2 ON e1.dept_id = e2.dept_id AND e1.id < e2.id
      ORDER BY salary_gap DESC
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      (1, 'Alice Chen', 'Bob Smith', 30000),
      (1, 'Alice Chen', 'Carol Davis', 20000),
      (1, 'Carol Davis', 'Bob Smith', 10000),
      (2, 'David Wilson', 'Eva Martinez', 15000),
      (2, 'David Wilson', 'Frank Brown', 5000),
      (2, 'Frank Brown', 'Eva Martinez', 10000),
      (3, 'Grace Lee', 'Henry Taylor', 15000)
    ) expected(dept_id, higher_paid, lower_paid, salary_gap)
  ) THEN 1 ELSE 0 END AS correct;
