slug: "salary-gap-between-peers"
title: "Salary Gap Between Peers"
description: |
  Find pairs of employees in the same department with the largest salary difference.
difficulty: medium
mode: read
category: self-joins
datasets:
  - hr
sampleInput:
  - "employees(id, name, dept_id, salary)"
sampleOutput: |
  dept_id | higher_paid | lower_paid | salary_gap
  |---|---|---|---|
