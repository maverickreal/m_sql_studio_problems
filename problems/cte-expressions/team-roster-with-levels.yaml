solutionSql: |
  WITH RECURSIVE team AS (
    SELECT e.id, e.name, e.manager_id, 1 AS lvl, e.id AS root
    FROM employees e WHERE e.manager_id IS NULL
    UNION ALL
    SELECT e.id, e.name, e.manager_id, t.lvl + 1, t.root
    FROM employees e JOIN team t ON e.manager_id = t.id
  )
  SELECT m.name AS manager_name, COUNT(t.id) AS team_size, MAX(t.lvl) - 1 AS max_depth
  FROM team t JOIN employees m ON t.root = m.id
  WHERE t.manager_id IS NOT NULL
  GROUP BY m.name ORDER BY team_size DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      WITH RECURSIVE team AS (
        SELECT e.id, e.name, e.manager_id, 1 AS lvl, e.id AS root
        FROM employees e WHERE e.manager_id IS NULL
        UNION ALL
        SELECT e.id, e.name, e.manager_id, t.lvl + 1, t.root
        FROM employees e JOIN team t ON e.manager_id = t.id
      )
      SELECT m.name AS manager_name, COUNT(t.id) AS team_size, MAX(t.lvl) - 1 AS max_depth
      FROM team t JOIN employees m ON t.root = m.id
      WHERE t.manager_id IS NOT NULL
      GROUP BY m.name ORDER BY team_size DESC
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      ('Alice Chen', 2, 1), ('David Wilson', 2, 1), ('Grace Lee', 1, 1)
    ) expected(manager_name, team_size, max_depth)
  ) THEN 1 ELSE 0 END AS correct;
