id: "01a08dde-846e-768d-83be-4f4ecdf14071"
slug: "shipments-same-city-forbidden"
title: "Shipments between different warehouses"
description: |
  Shipment ids where origin != dest.
difficulty: easy
mode: read
category: ops-logistics
datasets:
  - ops-logistics
sampleInput:
  - "warehouses(id, name, city, capacity)"
  - "shipments(id, origin_warehouse_id, dest_warehouse_id, ship_date, delivery_date, status, weight_kg)"
  - "inventory(id, warehouse_id, product_name, quantity, reorder_level)"
  - "carriers(id, name, type)"
  - "shipment_carriers(shipment_id, carrier_id, cost)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: ops-logistics
solutionSql: |
  SELECT id FROM shipments WHERE origin_warehouse_id <> dest_warehouse_id ORDER BY id
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
