id: "01a09454-b270-7566-b09b-d03d29df82a8"
slug: "warehouse-shipment-volume"
title: "Warehouse Shipment Volume"
description: |
  Count total shipments originating from each warehouse.
difficulty: easy
mode: read
category: ops-logistics
datasets:
  - ops-logistics
sampleInput:
  - "warehouses(id, name)"
  - "shipments(id, origin_warehouse_id)"
sampleOutput: "warehouse_name | shipment_count\n---|---\nNorth Hub | 2\nSouth Depot | 2\nEast Center | 2\nWest Station | 2"
initSql: |
  -- Dataset: ops-logistics (see datasets/ops-logistics/ for schema + seed)
solutionSql: |
  SELECT w.name AS warehouse_name, COUNT(s.id) AS shipment_count
  FROM warehouses w
  LEFT JOIN shipments s ON w.id = s.origin_warehouse_id
  GROUP BY w.name
  ORDER BY shipment_count DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT w.name AS warehouse_name, COUNT(s.id) AS shipment_count
      FROM warehouses w
      LEFT JOIN shipments s ON w.id = s.origin_warehouse_id
      GROUP BY w.name
      ORDER BY shipment_count DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES ('North Hub', 2), ('South Depot', 2), ('East Center', 2), ('West Station', 2)
    ) expected(warehouse_name, shipment_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
