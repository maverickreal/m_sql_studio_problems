id: "01a08dde-8461-7705-8af3-8f95ffaf5862"
slug: "in-transit-shipments"
title: "In-transit shipments"
description: |
  Shipment ids with status in_transit or equivalent in-transit wording in data. List ids whose status is not delivered.
difficulty: easy
mode: read
category: ops-logistics
datasets:
  - ops-logistics
sampleInput:
  - "warehouses(id, name, city, capacity)"
  - "shipments(id, origin_warehouse_id, dest_warehouse_id, ship_date, delivery_date, status, weight_kg)"
  - "inventory(id, warehouse_id, product_name, quantity, reorder_level)"
  - "carriers(id, name, type)"
  - "shipment_carriers(shipment_id, carrier_id, cost)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: ops-logistics
solutionSql: |
  SELECT id FROM shipments WHERE status <> 'delivered' ORDER BY id
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
