id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f86"
slug: "dept-with-3plus-employees"
title: "Departments with 3+ Employees"
description: |
  Find departments that have at least 3 employees. Return department name and employee count.
difficulty: easy
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "dept_name | employee_count\n---|---\nEngineering | 3\nSales | 3"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT d.name AS dept_name, COUNT(e.id) AS employee_count
  FROM departments d
  JOIN employees e ON d.id = e.dept_id
  GROUP BY d.name
  HAVING COUNT(e.id) >= 3
  ORDER BY employee_count DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name, COUNT(e.id) AS employee_count
      FROM departments d
      JOIN employees e ON d.id = e.dept_id
      GROUP BY d.name
      HAVING COUNT(e.id) >= 3
      ORDER BY employee_count DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 3),
        ('Sales', 3)
    ) expected(dept_name, employee_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
