id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f78"
slug: "high-value-projects"
title: "High-Value Projects with Multiple Leads"
description: |
  Find projects with budget over 200000 that have more than one Lead. Return project name, budget, and lead count.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "projects(id, name, dept_id, budget)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "project_name | budget | lead_count\n---|---|---\nData Pipeline | 500000 | 1\nCRM Integration | 200000 | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT p.name AS project_name,
    p.budget,
    COUNT(*) FILTER (WHERE ep.role = 'Lead') AS lead_count
  FROM projects p
  JOIN employee_projects ep ON p.id = ep.project_id
  WHERE p.budget > 200000
  GROUP BY p.id, p.name, p.budget
  HAVING COUNT(*) FILTER (WHERE ep.role = 'Lead') > 0
  ORDER BY p.budget DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT p.name AS project_name,
        p.budget,
        COUNT(*) FILTER (WHERE ep.role = 'Lead') AS lead_count
      FROM projects p
      JOIN employee_projects ep ON p.id = ep.project_id
      WHERE p.budget > 200000
      GROUP BY p.id, p.name, p.budget
      HAVING COUNT(*) FILTER (WHERE ep.role = 'Lead') > 0
      ORDER BY p.budget DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Data Pipeline', 500000, 1),
        ('CRM Integration', 200000, 1)
    ) expected(project_name, budget, lead_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
