solutionSql: |
  SELECT d.name AS dept_name,
    SUM(e.salary) AS salary_cost,
    SUM(p.budget) AS project_budget,
    CASE WHEN SUM(p.budget) > 0 THEN ROUND(SUM(e.salary) * 100.0 / SUM(p.budget), 2) ELSE NULL END AS utilization_pct
  FROM departments d
  LEFT JOIN employees e ON d.id = e.dept_id
  LEFT JOIN projects p ON d.id = p.dept_id
  GROUP BY d.name ORDER BY utilization_pct DESC NULLS LAST;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name, SUM(e.salary) AS salary_cost, SUM(p.budget) AS project_budget,
        CASE WHEN SUM(p.budget) > 0 THEN ROUND(SUM(e.salary) * 100.0 / SUM(p.budget), 2) ELSE NULL END AS utilization_pct
      FROM departments d LEFT JOIN employees e ON d.id = e.dept_id LEFT JOIN projects p ON d.id = p.dept_id
      GROUP BY d.name ORDER BY utilization_pct DESC NULLS LAST
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      ('Engineering', 400000, 800000, 50.00),
      ('Sales', 310000, 200000, 155.00),
      ('Marketing', 185000, 150000, 123.33),
      ('HR', 90000, 0, NULL)
    ) expected(dept_name, salary_cost, project_budget, utilization_pct)
  ) THEN 1 ELSE 0 END AS correct;
