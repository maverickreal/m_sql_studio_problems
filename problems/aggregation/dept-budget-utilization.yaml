slug: "dept-budget-utilization"
title: "Department Budget Utilization"
description: |
  Show what fraction of department budget is consumed by employee salaries.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name)"
  - "employees(dept_id, salary)"
  - "projects(dept_id, budget)"
sampleOutput: |
  dept_name | salary_cost | project_budget | utilization_pct
  |---|---|---|---|
  Engineering | 400000 | 800000 | 50.00
  Sales | 310000 | 200000 | 155.00
  Marketing | 185000 | 150000 | 123.33
  HR | 90000 | 0 | NULL
initSql: |
  CREATE TABLE employees (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      dept_id INT NOT NULL,
      salary INT NOT NULL,
      hire_date DATE NOT NULL,
      manager_id INT
  );
  
  CREATE TABLE departments (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      location VARCHAR(100) NOT NULL
  );
  
  CREATE TABLE projects (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      dept_id INT NOT NULL,
      budget INT NOT NULL
  );
  
  CREATE TABLE employee_projects (
      employee_id INT NOT NULL,
      project_id INT NOT NULL,
      role VARCHAR(50) NOT NULL,
      PRIMARY KEY (employee_id, project_id)
  );
  
  INSERT INTO departments (id, name, location) VALUES
      (1, 'Engineering', 'San Francisco'),
      (2, 'Sales', 'New York'),
      (3, 'Marketing', 'Austin'),
      (4, 'HR', 'Chicago');
  
  INSERT INTO employees (id, name, dept_id, salary, hire_date, manager_id) VALUES
