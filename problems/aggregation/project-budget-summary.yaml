id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f6d"
slug: "project-budget-summary"
title: "Project Budget Summary"
description: |
  List each project with its department, total budget, and the number of employees assigned to it. Include projects with zero employees.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "projects(id, name, dept_id, budget)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "project_name | dept_name | budget | employee_count\n---|---|---|---\nData Pipeline | Engineering | 500000 | 3\nMobile App | Engineering | 300000 | 2\nCRM Integration | Sales | 200000 | 2\nBrand Campaign | Marketing | 150000 | 2"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT p.name AS project_name,
    d.name AS dept_name,
    p.budget,
    COUNT(ep.employee_id) AS employee_count
  FROM projects p
  JOIN departments d ON p.dept_id = d.id
  LEFT JOIN employee_projects ep ON p.id = ep.project_id
  GROUP BY p.name, d.name, p.budget
  ORDER BY p.budget DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT p.name AS project_name,
        d.name AS dept_name,
        p.budget,
        COUNT(ep.employee_id) AS employee_count
      FROM projects p
      JOIN departments d ON p.dept_id = d.id
      LEFT JOIN employee_projects ep ON p.id = ep.project_id
      GROUP BY p.name, d.name, p.budget
      ORDER BY p.budget DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Data Pipeline', 'Engineering', 500000, 3),
        ('Mobile App', 'Engineering', 300000, 2),
        ('CRM Integration', 'Sales', 200000, 2),
        ('Brand Campaign', 'Marketing', 150000, 2)
    ) expected(project_name, dept_name, budget, employee_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
