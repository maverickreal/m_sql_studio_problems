id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f84"
slug: "avg-salary-by-role"
title: "Average Salary by Project Role"
description: |
  Find the average salary for each project role (Lead, Developer, Analyst, Designer). Only include roles with at least 2 employees.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "role | avg_salary | employee_count\n---|---|---\nLead | 125000.00 | 4\nDeveloper | 111666.67 | 3"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT ep.role,
    ROUND(AVG(e.salary), 2) AS avg_salary,
    COUNT(*) AS employee_count
  FROM employees e
  JOIN employee_projects ep ON e.id = ep.employee_id
  GROUP BY ep.role
  HAVING COUNT(*) >= 2
  ORDER BY avg_salary DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT ep.role,
        ROUND(AVG(e.salary), 2) AS avg_salary,
        COUNT(*) AS employee_count
      FROM employees e
      JOIN employee_projects ep ON e.id = ep.employee_id
      GROUP BY ep.role
      HAVING COUNT(*) >= 2
      ORDER BY avg_salary DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Lead', 125000.00, 4),
        ('Developer', 111666.67, 3)
    ) expected(role, avg_salary, employee_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
