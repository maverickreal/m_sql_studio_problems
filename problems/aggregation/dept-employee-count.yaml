id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f81"
slug: "dept-employee-count"
title: "Department Employee Count"
description: |
  Count the number of employees in each department. Include departments with zero employees.
difficulty: easy
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "dept_name | employee_count\n---|---\nEngineering | 3\nSales | 3\nMarketing | 2\nHR | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT d.name AS dept_name, COUNT(e.id) AS employee_count
  FROM departments d
  LEFT JOIN employees e ON d.id = e.dept_id
  GROUP BY d.name
  ORDER BY employee_count DESC, dept_name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name, COUNT(e.id) AS employee_count
      FROM departments d
      LEFT JOIN employees e ON d.id = e.dept_id
      GROUP BY d.name
      ORDER BY employee_count DESC, dept_name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 3),
        ('Sales', 3),
        ('Marketing', 2),
        ('HR', 1)
    ) expected(dept_name, employee_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
