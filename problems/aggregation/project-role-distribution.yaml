id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f7f"
slug: "project-role-distribution"
title: "Project Role Distribution"
description: |
  For each project, count employees by role. Return project name and counts for Lead, Developer, Analyst, Designer roles.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "projects(id, name, dept_id, budget)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "project_name | lead_count | developer_count | analyst_count | designer_count\n---|---|---|---|---\nData Pipeline | 1 | 2 | 0 | 0\nMobile App | 1 | 1 | 0 | 0\nCRM Integration | 1 | 0 | 1 | 0\nBrand Campaign | 1 | 0 | 0 | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT p.name AS project_name,
    COUNT(*) FILTER (WHERE ep.role = 'Lead') AS lead_count,
    COUNT(*) FILTER (WHERE ep.role = 'Developer') AS developer_count,
    COUNT(*) FILTER (WHERE ep.role = 'Analyst') AS analyst_count,
    COUNT(*) FILTER (WHERE ep.role = 'Designer') AS designer_count
  FROM projects p
  JOIN employee_projects ep ON p.id = ep.project_id
  GROUP BY p.id, p.name
  ORDER BY p.name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT p.name AS project_name,
        COUNT(*) FILTER (WHERE ep.role = 'Lead') AS lead_count,
        COUNT(*) FILTER (WHERE ep.role = 'Developer') AS developer_count,
        COUNT(*) FILTER (WHERE ep.role = 'Analyst') AS analyst_count,
        COUNT(*) FILTER (WHERE ep.role = 'Designer') AS designer_count
      FROM projects p
      JOIN employee_projects ep ON p.id = ep.project_id
      GROUP BY p.id, p.name
      ORDER BY p.name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Data Pipeline', 1, 2, 0, 0),
        ('Mobile App', 1, 1, 0, 0),
        ('CRM Integration', 1, 0, 1, 0),
        ('Brand Campaign', 1, 0, 0, 1)
    ) expected(project_name, lead_count, developer_count, analyst_count, designer_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
author: "maverickreal"
