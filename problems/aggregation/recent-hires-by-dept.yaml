id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f79"
slug: "recent-hires-by-dept"
title: "Recent Hires by Department (Last 2 Years)"
description: |
  Count employees hired in the last 2 years per department. Only include departments with at least 2 such hires.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "dept_name | recent_hire_count\n---|---\nEngineering | 2\nSales | 2"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT d.name AS dept_name,
    COUNT(*) AS recent_hire_count
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  WHERE e.hire_date >= (SELECT MAX(hire_date) FROM employees) - INTERVAL '2 years'
  GROUP BY d.name
  HAVING COUNT(*) >= 2
  ORDER BY recent_hire_count DESC, dept_name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name,
        COUNT(*) AS recent_hire_count
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      WHERE e.hire_date >= (SELECT MAX(hire_date) FROM employees) - INTERVAL '2 years'
      GROUP BY d.name
      HAVING COUNT(*) >= 2
      ORDER BY recent_hire_count DESC, dept_name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 2),
        ('Sales', 2)
    ) expected(dept_name, recent_hire_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
