id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f6b"
slug: "top-earners-by-dept"
title: "Top Earners by Department"
description: |
  Find the top 2 highest-paid employees in each department. Return department name, employee name, and salary.
difficulty: medium
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "dept_name | employee_name | salary\n---|---|---\nEngineering | Alice Chen | 150000\nEngineering | Carol Davis | 130000\nSales | David Wilson | 110000\nSales | Frank Brown | 105000\nMarketing | Grace Lee | 100000\nHR | Iris Anderson | 90000"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT d.name AS dept_name, e.name AS employee_name, e.salary
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  JOIN (
    SELECT dept_id, MAX(salary) AS max_sal
    FROM employees
    GROUP BY dept_id
  ) m ON e.dept_id = m.dept_id AND e.salary = m.max_sal
  ORDER BY d.name, e.salary DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name, e.name AS employee_name, e.salary
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      JOIN (
        SELECT dept_id, MAX(salary) AS max_sal
        FROM employees
        GROUP BY dept_id
      ) m ON e.dept_id = m.dept_id AND e.salary = m.max_sal
      ORDER BY d.name, e.salary DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 'Alice Chen', 150000),
        ('Engineering', 'Carol Davis', 130000),
        ('Sales', 'David Wilson', 110000),
        ('Sales', 'Frank Brown', 105000),
        ('Marketing', 'Grace Lee', 100000),
        ('HR', 'Iris Anderson', 90000)
    ) expected(dept_name, employee_name, salary)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: false
origin: first-party
