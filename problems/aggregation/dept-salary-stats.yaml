id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f6c"
slug: "dept-salary-stats"
title: "Department Salary Statistics"
description: |
  For each department, compute the average, minimum, and maximum salary. Also count the number of employees. Round average to 2 decimal places.
difficulty: easy
mode: read
category: aggregation
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "dept_name | avg_salary | min_salary | max_salary | emp_count\n---|---|---|---|---\nEngineering | 133333.33 | 120000 | 150000 | 3\nSales | 103333.33 | 95000 | 110000 | 3\nMarketing | 92500.00 | 85000 | 100000 | 2\nHR | 90000.00 | 90000 | 90000 | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT d.name AS dept_name,
    ROUND(AVG(e.salary), 2) AS avg_salary,
    MIN(e.salary) AS min_salary,
    MAX(e.salary) AS max_salary,
    COUNT(*) AS emp_count
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  GROUP BY d.name
  ORDER BY d.name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name,
        ROUND(AVG(e.salary), 2) AS avg_salary,
        MIN(e.salary) AS min_salary,
        MAX(e.salary) AS max_salary,
        COUNT(*) AS emp_count
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      GROUP BY d.name
      ORDER BY d.name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 133333.33, 120000, 150000, 3),
        ('Sales', 103333.33, 95000, 110000, 3),
        ('Marketing', 92500.00, 85000, 100000, 2),
        ('HR', 90000.00, 90000, 90000, 1)
    ) expected(dept_name, avg_salary, min_salary, max_salary, emp_count)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: false
origin: first-party
author: "maverickreal"
