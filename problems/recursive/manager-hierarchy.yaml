id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f76"
slug: "manager-hierarchy"
title: "Manager Hierarchy Tree"
description: |
  Build a complete management hierarchy tree starting from the top-level managers (those with no manager). Show each employee with their level in the hierarchy and their manager's name. Use a recursive CTE.
difficulty: hard
mode: read
category: recursive
datasets:
  - hr
sampleInput:
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | manager_name | level\n---|---|---\nAlice Chen |  | 0\nDavid Wilson |  | 0\nGrace Lee |  | 0\nIris Anderson |  | 0\nBob Smith | Alice Chen | 1\nCarol Davis | Alice Chen | 1\nEva Martinez | David Wilson | 1\nFrank Brown | David Wilson | 1\nHenry Taylor | Grace Lee | 1"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  WITH RECURSIVE hierarchy AS (
    -- Base case: top-level managers (no manager_id)
    SELECT id, name, manager_id, 0 AS level, ''::text AS manager_name
    FROM employees
    WHERE manager_id IS NULL
    
    UNION ALL
    
    -- Recursive case: find reports
    SELECT e.id, e.name, e.manager_id, h.level + 1, h.name AS manager_name
    FROM employees e
    JOIN hierarchy h ON e.manager_id = h.id
  )
  SELECT name, manager_name, level
  FROM hierarchy
  ORDER BY level, name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      WITH RECURSIVE hierarchy AS (
        SELECT id, name, manager_id, 0 AS level, ''::text AS manager_name
        FROM employees
        WHERE manager_id IS NULL
        
        UNION ALL
        
        SELECT e.id, e.name, e.manager_id, h.level + 1, h.name AS manager_name
        FROM employees e
        JOIN hierarchy h ON e.manager_id = h.id
      )
      SELECT name, manager_name, level
      FROM hierarchy
      ORDER BY level, name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Alice Chen', '', 0),
        ('David Wilson', '', 0),
        ('Grace Lee', '', 0),
        ('Iris Anderson', '', 0),
        ('Bob Smith', 'Alice Chen', 1),
        ('Carol Davis', 'Alice Chen', 1),
        ('Eva Martinez', 'David Wilson', 1),
        ('Frank Brown', 'David Wilson', 1),
        ('Henry Taylor', 'Grace Lee', 1)
    ) expected(name, manager_name, level)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
