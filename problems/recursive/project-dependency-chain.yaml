id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f77"
slug: "project-dependency-chain"
title: "Project Dependency Chain"
description: |
  Find all employees who work on projects that belong to departments other than their own. Use a recursive CTE to trace the chain: employee -> project -> project's department -> employee's department (must differ).
difficulty: hard
mode: read
category: recursive
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
  - "projects(id, name, dept_id, budget)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "employee_name | employee_dept | project_name | project_dept\n---|---|---|---\nBob Smith | Engineering | CRM Integration | Sales\nFrank Brown | Sales | Data Pipeline | Engineering\nFrank Brown | Sales | Mobile App | Engineering\nHenry Taylor | Marketing | CRM Integration | Sales"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT e.name AS employee_name,
    de.name AS employee_dept,
    p.name AS project_name,
    dp.name AS project_dept
  FROM employees e
  JOIN departments de ON e.dept_id = de.id
  JOIN employee_projects ep ON e.id = ep.employee_id
  JOIN projects p ON ep.project_id = p.id
  JOIN departments dp ON p.dept_id = dp.id
  WHERE de.id != dp.id
  ORDER BY employee_name, project_name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e.name AS employee_name,
        de.name AS employee_dept,
        p.name AS project_name,
        dp.name AS project_dept
      FROM employees e
      JOIN departments de ON e.dept_id = de.id
      JOIN employee_projects ep ON e.id = ep.employee_id
      JOIN projects p ON ep.project_id = p.id
      JOIN departments dp ON p.dept_id = dp.id
      WHERE de.id != dp.id
      ORDER BY employee_name, project_name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Bob Smith', 'Engineering', 'CRM Integration', 'Sales'),
        ('Frank Brown', 'Sales', 'Data Pipeline', 'Engineering'),
        ('Frank Brown', 'Sales', 'Mobile App', 'Engineering'),
        ('Henry Taylor', 'Marketing', 'CRM Integration', 'Sales')
    ) expected(employee_name, employee_dept, project_name, project_dept)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
