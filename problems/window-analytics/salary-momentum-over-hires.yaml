solutionSql: |
  SELECT name, hire_date, salary,
  LAG(salary) OVER (ORDER BY hire_date) AS prev_hire_salary,
  CASE
    WHEN LAG(salary) OVER (ORDER BY hire_date) IS NULL THEN 'START'
    WHEN salary > LAG(salary) OVER (ORDER BY hire_date) THEN 'UP'
    WHEN salary < LAG(salary) OVER (ORDER BY hire_date) THEN 'DOWN'
    ELSE 'FLAT'
  END AS trend
  FROM employees ORDER BY hire_date;
validationSql: |
  SELECT CASE WHEN COUNT(*) = 9 THEN 1 ELSE 0 END AS correct FROM (
  SELECT name, hire_date, salary,
    LAG(salary) OVER (ORDER BY hire_date) AS prev_hire_salary,
    CASE
      WHEN LAG(salary) OVER (ORDER BY hire_date) IS NULL THEN 'START'
      WHEN salary > LAG(salary) OVER (ORDER BY hire_date) THEN 'UP'
      WHEN salary < LAG(salary) OVER (ORDER BY hire_date) THEN 'DOWN'
      ELSE 'FLAT'
    END AS trend
  FROM employees ORDER BY hire_date
  ) t;
