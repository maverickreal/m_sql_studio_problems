slug: "tenure-categories"
title: "Employee Tenure Categories"
description: |
  Categorize employees into tenure brackets using hire date: <1 year, 1-3 years, 3-5 years, >5 years.
difficulty: medium
mode: read
category: date-arithmetic
datasets:
  - hr
sampleInput:
  - "employees(id, name, hire_date)"
sampleOutput: |
  name | hire_date | years_since_hire | tenure_category
  |---|---|---|---|
  Alice Chen | 2020-01-15 | 6 | >5 years
  Bob Smith | 2021-03-22 | 5 | 3-5 years
  Carol Davis | 2021-06-10 | 5 | 3-5 years
  David Wilson | 2019-11-05 | 6 | >5 years
  Eva Martinez | 2022-02-14 | 4 | 3-5 years
  Frank Brown | 2022-08-30 | 3 | 3-5 years
