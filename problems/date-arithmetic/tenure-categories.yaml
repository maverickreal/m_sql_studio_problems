solutionSql: |
  SELECT name, hire_date,
    EXTRACT(YEAR FROM AGE('2026-01-01'::date, hire_date)) AS years_since_hire,
    CASE
      WHEN AGE('2026-01-01'::date, hire_date) < INTERVAL '1 year' THEN '<1 year'
      WHEN AGE('2026-01-01'::date, hire_date) < INTERVAL '3 years' THEN '1-3 years'
      WHEN AGE('2026-01-01'::date, hire_date) < INTERVAL '5 years' THEN '3-5 years'
      ELSE '>5 years'
    END AS tenure_category
  FROM employees ORDER BY years_since_hire DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT name, hire_date,
        EXTRACT(YEAR FROM AGE('2026-01-01'::date, hire_date)) AS years_since_hire,
        CASE
          WHEN AGE('2026-01-01'::date, hire_date) < INTERVAL '1 year' THEN '<1 year'
          WHEN AGE('2026-01-01'::date, hire_date) < INTERVAL '3 years' THEN '1-3 years'
          WHEN AGE('2026-01-01'::date, hire_date) < INTERVAL '5 years' THEN '3-5 years'
          ELSE '>5 years'
        END AS tenure_category
      FROM employees ORDER BY years_since_hire DESC
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      ('Alice Chen', '2020-01-15', 6, '>5 years'),
      ('David Wilson', '2019-11-05', 6, '>5 years'),
      ('Bob Smith', '2021-03-22', 4, '3-5 years'),
      ('Carol Davis', '2021-06-10', 4, '3-5 years'),
      ('Eva Martinez', '2022-02-14', 3, '3-5 years'),
      ('Frank Brown', '2022-08-30', 3, '3-5 years'),
      ('Grace Lee', '2021-04-18', 4, '3-5 years'),
      ('Henry Taylor', '2023-01-12', 3, '3-5 years'),
      ('Iris Anderson', '2020-09-03', 5, '3-5 years')
    ) expected(name, hire_date, years_since_hire, tenure_category)
  ) THEN 1 ELSE 0 END AS correct;
