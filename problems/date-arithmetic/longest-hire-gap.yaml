id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e6018"
slug: "longest-hire-gap"
title: "Longest Gap Between Hires"
description: |
  Find the longest time gap between consecutive hires in the company.
difficulty: medium
mode: read
category: date-arithmetic
datasets:
  - hr
sampleInput:
  - "employees(id, hire_date)"
sampleOutput: |
  previous_hire | next_hire | gap_days
  |---|---|---|
  2023-01-12 | NULL | NULL
  2022-08-30 | 2023-01-12 | 135
  2022-02-14 | 2022-08-30 | 197
initSql: |
  CREATE TABLE employees (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      dept_id INT NOT NULL,
      salary INT NOT NULL,
      hire_date DATE NOT NULL,
      manager_id INT
  );
  
  CREATE TABLE departments (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      location VARCHAR(100) NOT NULL
  );
  
  CREATE TABLE projects (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      dept_id INT NOT NULL,
      budget INT NOT NULL
  );
  
  CREATE TABLE employee_projects (
      employee_id INT NOT NULL,
      project_id INT NOT NULL,
      role VARCHAR(50) NOT NULL,
      PRIMARY KEY (employee_id, project_id)
  );
  
  INSERT INTO departments (id, name, location) VALUES
      (1, 'Engineering', 'San Francisco'),
      (2, 'Sales', 'New York'),
      (3, 'Marketing', 'Austin'),
      (4, 'HR', 'Chicago');
  
  INSERT INTO employees (id, name, dept_id, salary, hire_date, manager_id) VALUES
      (1, 'Alice Chen', 1, 150000, '2020-01-15', NULL),
      (2, 'Bob Smith', 1, 120000, '2021-03-22', 1),
      (3, 'Carol Davis', 1, 130000, '2021-06-10', 1),
      (4, 'David Wilson', 2, 110000, '2019-11-05', NULL),
      (5, 'Eva Martinez', 2, 95000, '2022-02-14', 4),
      (6, 'Frank Brown', 2, 105000, '2022-08-30', 4),
      (7, 'Grace Lee', 3, 100000, '2021-04-18', NULL),
      (8, 'Henry Taylor', 3, 85000, '2023-01-12', 7),
      (9, 'Iris Anderson', 4, 90000, '2020-09-03', NULL);
  
  INSERT INTO projects (id, name, dept_id, budget) VALUES
      (1, 'Data Pipeline', 1, 500000),
      (2, 'Mobile App', 1, 300000),
      (3, 'CRM Integration', 2, 200000),
      (4, 'Brand Campaign', 3, 150000);
  
  INSERT INTO employee_projects (employee_id, project_id, role) VALUES
      (1, 1, 'Lead'),
      (2, 1, 'Developer'),
      (3, 1, 'Developer'),
      (2, 2, 'Lead'),
      (4, 3, 'Lead'),
      (5, 3, 'Analyst'),
      (7, 4, 'Lead'),
      (8, 4, 'Designer');

solutionSql: |
  WITH ordered AS (
    SELECT hire_date, LEAD(hire_date) OVER (ORDER BY hire_date) AS next_hire_date
    FROM employees
  )
  SELECT hire_date AS previous_hire, next_hire_date AS next_hire,
    (next_hire_date - hire_date) AS gap_days
  FROM ordered
  ORDER BY gap_days DESC LIMIT 3;
validationSql: |
  SELECT CASE WHEN COUNT(*) = 3 THEN 1 ELSE 0 END AS correct FROM (
    WITH ordered AS (
      SELECT hire_date, LEAD(hire_date) OVER (ORDER BY hire_date) AS next_hire_date FROM employees
    )
    SELECT hire_date AS previous_hire, next_hire_date AS next_hire, (next_hire_date - hire_date) AS gap_days
    FROM ordered ORDER BY gap_days DESC LIMIT 3
  ) t;
