id: "01a08dde-8396-7eb2-840e-57eb12ffe6ea"
slug: "commenters-on-multiple-articles"
title: "Commenters on more than one article"
description: |
  Commenter names who commented on at least two distinct articles.
difficulty: medium
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT commenter_name FROM comments GROUP BY commenter_name HAVING COUNT(DISTINCT article_id) >= 2 ORDER BY commenter_name
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
