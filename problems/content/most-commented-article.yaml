id: "01a08dde-8389-750c-8add-b178757d9787"
slug: "most-commented-article"
title: "Most commented article"
description: |
  Article title with the highest comment count.
difficulty: easy
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT ar.title FROM articles ar JOIN comments c ON c.article_id = ar.id GROUP BY ar.title ORDER BY COUNT(c.id) DESC, ar.title LIMIT 1
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
