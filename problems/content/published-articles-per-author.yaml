id: "01a08dde-8374-7901-8404-14d647661da2"
slug: "published-articles-per-author"
title: "Published articles per author"
description: |
  Return each author and how many published articles they have, including authors with zero.
difficulty: easy
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT a.name AS author_name, COUNT(ar.id) FILTER (WHERE ar.status = 'published') AS published_count FROM authors a LEFT JOIN articles ar ON ar.author_id = a.id GROUP BY a.name ORDER BY published_count DESC, author_name
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
