id: "01a08dde-8384-7f4f-83fd-12637cf5c36b"
slug: "articles-without-comments"
title: "Articles with no comments"
description: |
  Return published article titles that have no comments.
difficulty: easy
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT ar.title FROM articles ar LEFT JOIN comments c ON c.article_id = ar.id WHERE ar.status = 'published' GROUP BY ar.title HAVING COUNT(c.id) = 0 ORDER BY ar.title
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
