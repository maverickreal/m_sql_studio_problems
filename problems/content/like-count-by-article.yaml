id: "01a08dde-8393-7c73-81de-1af336d3508b"
slug: "like-count-by-article"
title: "Like counts by article"
description: |
  Each article title with its like count, including zero.
difficulty: easy
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT ar.title, COUNT(l.id) AS like_count FROM articles ar LEFT JOIN likes l ON l.article_id = ar.id GROUP BY ar.title ORDER BY like_count DESC, ar.title
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
