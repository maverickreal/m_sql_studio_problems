id: "01a08dde-83ab-7d9c-88fb-ef872fb8cbfd"
slug: "unpublished-with-likes"
title: "Drafts that already have likes"
description: |
  Draft article titles that have at least one like.
difficulty: medium
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT ar.title FROM articles ar JOIN likes l ON l.article_id = ar.id WHERE ar.status = 'draft' GROUP BY ar.title ORDER BY ar.title
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
