id: "01a08dde-83a8-7197-8b8c-b06f2a4e37ee"
slug: "rank-articles-by-likes"
title: "Rank articles by likes"
description: |
  Article title and like-rank (1 = most liked). Ties share rank.
difficulty: medium
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT ar.title, RANK() OVER (ORDER BY COUNT(l.id) DESC) AS like_rank FROM articles ar LEFT JOIN likes l ON l.article_id = ar.id GROUP BY ar.title ORDER BY like_rank, ar.title
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
