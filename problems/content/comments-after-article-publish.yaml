id: "01a08dde-83b0-75e6-8286-a8cdf2b7d8ce"
slug: "comments-after-article-publish"
title: "Comments posted after publish date"
description: |
  Commenter name and article title where posted_date is after published_date.
difficulty: medium
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT c.commenter_name, ar.title FROM comments c JOIN articles ar ON ar.id = c.article_id WHERE c.posted_date > ar.published_date ORDER BY c.commenter_name, ar.title
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
