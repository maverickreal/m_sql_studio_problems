id: "01a08dde-839b-7163-891a-3317f4bce775"
slug: "performance-category-authors"
title: "Authors of performance articles"
description: |
  Distinct author names who wrote a Performance category article.
difficulty: easy
mode: read
category: content
datasets:
  - content
sampleInput:
  - "authors(id, name, email, joined_date)"
  - "articles(id, title, author_id, category, published_date, word_count, status)"
  - "comments(id, article_id, commenter_name, body, posted_date)"
  - "tags(id, name)"
  - "article_tags(article_id, tag_id)"
  - "likes(id, article_id, user_name, liked_date)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: content
solutionSql: |
  SELECT DISTINCT a.name FROM authors a JOIN articles ar ON ar.author_id = a.id WHERE ar.category = 'Performance' ORDER BY a.name
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
