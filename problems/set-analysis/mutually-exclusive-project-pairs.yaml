id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e6026"
slug: "mutually-exclusive-project-pairs"
title: "Mutually Exclusive Project Pairs"
description: |
  Find pairs of projects that share no common employees.
difficulty: hard
mode: read
category: set-analysis
datasets:
  - hr
sampleInput:
  - "projects(id, name)"
  - "employee_projects(project_id, employee_id)"
sampleOutput: |
  project_a | project_b
  |---|---|
  Brand Campaign | Data Pipeline
  Brand Campaign | Mobile App
  CRM Integration | Mobile App
initSql: |
  CREATE TABLE employees (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      dept_id INT NOT NULL,
      salary INT NOT NULL,
      hire_date DATE NOT NULL,
      manager_id INT
  );
  
  CREATE TABLE departments (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      location VARCHAR(100) NOT NULL
  );
  
  CREATE TABLE projects (
      id INT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      dept_id INT NOT NULL,
      budget INT NOT NULL
  );
  
  CREATE TABLE employee_projects (
      employee_id INT NOT NULL,
      project_id INT NOT NULL,
      role VARCHAR(50) NOT NULL,
      PRIMARY KEY (employee_id, project_id)
  );
  
  INSERT INTO departments (id, name, location) VALUES
      (1, 'Engineering', 'San Francisco'),
      (2, 'Sales', 'New York'),
      (3, 'Marketing', 'Austin'),
      (4, 'HR', 'Chicago');
  
  INSERT INTO employees (id, name, dept_id, salary, hire_date, manager_id) VALUES
      (1, 'Alice Chen', 1, 150000, '2020-01-15', NULL),
      (2, 'Bob Smith', 1, 120000, '2021-03-22', 1),
      (3, 'Carol Davis', 1, 130000, '2021-06-10', 1),
      (4, 'David Wilson', 2, 110000, '2019-11-05', NULL),
      (5, 'Eva Martinez', 2, 95000, '2022-02-14', 4),
      (6, 'Frank Brown', 2, 105000, '2022-08-30', 4),
      (7, 'Grace Lee', 3, 100000, '2021-04-18', NULL),
      (8, 'Henry Taylor', 3, 85000, '2023-01-12', 7),
      (9, 'Iris Anderson', 4, 90000, '2020-09-03', NULL);
  
  INSERT INTO projects (id, name, dept_id, budget) VALUES
      (1, 'Data Pipeline', 1, 500000),
      (2, 'Mobile App', 1, 300000),
      (3, 'CRM Integration', 2, 200000),
      (4, 'Brand Campaign', 3, 150000);
  
  INSERT INTO employee_projects (employee_id, project_id, role) VALUES
      (1, 1, 'Lead'),
      (2, 1, 'Developer'),
      (3, 1, 'Developer'),
      (2, 2, 'Lead'),
      (4, 3, 'Lead'),
      (5, 3, 'Analyst'),
      (7, 4, 'Lead'),
      (8, 4, 'Designer');

solutionSql: |
  SELECT p1.name AS project_a, p2.name AS project_b
  FROM projects p1 CROSS JOIN projects p2
  WHERE p1.id < p2.id
  AND NOT EXISTS (
    SELECT 1 FROM employee_projects ep1
    JOIN employee_projects ep2 ON ep1.employee_id = ep2.employee_id
    WHERE ep1.project_id = p1.id AND ep2.project_id = p2.id
  )
  ORDER BY project_a, project_b;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT p1.name AS project_a, p2.name AS project_b
      FROM projects p1 CROSS JOIN projects p2
      WHERE p1.id < p2.id
      AND NOT EXISTS (
        SELECT 1 FROM employee_projects ep1
        JOIN employee_projects ep2 ON ep1.employee_id = ep2.employee_id
        WHERE ep1.project_id = p1.id AND ep2.project_id = p2.id
      )
      ORDER BY project_a, project_b
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      ('Brand Campaign', 'Data Pipeline'),
      ('Brand Campaign', 'Mobile App'),
      ('CRM Integration', 'Mobile App')
    ) expected(project_a, project_b)
  ) THEN 1 ELSE 0 END AS correct;
