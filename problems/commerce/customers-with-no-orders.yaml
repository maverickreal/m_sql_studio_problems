id: "01a09454-b248-73f1-b8b5-2403c3010196"
slug: "customers-with-no-orders"
title: "Customers With No Orders"
description: |
  Find customers who have never placed an order.
difficulty: easy
mode: read
category: commerce
datasets:
  - commerce
sampleInput:
  - "customers(id, name)"
  - "orders(id, customer_id)"
sampleOutput: "name\n---\n(no rows)"
initSql: |
  -- Dataset: commerce (see datasets/commerce/ for schema + seed)
solutionSql: |
  SELECT c.name
  FROM customers c
  LEFT JOIN orders o ON c.id = o.customer_id
  WHERE o.id IS NULL;
validationSql: |
  SELECT CASE WHEN COUNT(*) = 0 THEN 1 ELSE 0 END AS correct
  FROM (
    SELECT c.name
    FROM customers c
    LEFT JOIN orders o ON c.id = o.customer_id
    WHERE o.id IS NULL
  ) t;
orderMatters: false
