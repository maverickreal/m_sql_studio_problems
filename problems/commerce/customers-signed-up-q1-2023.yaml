id: "01a08dde-8451-7e14-8963-7be48ce4fb8c"
slug: "customers-signed-up-q1-2023"
title: "Customers who signed up in Q1 2023"
description: |
  Names with signup_date in Jan–Mar 2023.
difficulty: easy
mode: read
category: commerce
datasets:
  - commerce
sampleInput:
  - "customers(id, name, email, city, signup_date)"
  - "products(id, name, category, price, stock)"
  - "orders(id, customer_id, order_date, status)"
  - "order_items(id, order_id, product_id, quantity, unit_price)"
  - "payments(id, order_id, amount, method, paid_at)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: commerce
solutionSql: |
  SELECT name FROM customers WHERE signup_date >= DATE '2023-01-01' AND signup_date < DATE '2023-04-01' ORDER BY name
validationSql: |
  SELECT 1 AS ok
orderMatters: true
