id: "01a08dde-8444-70dc-8d9e-3b726dad7e72"
slug: "customers-who-ordered-electronics"
title: "Customers who ordered electronics"
description: |
  Distinct customer names who bought an Electronics product.
difficulty: medium
mode: read
category: commerce
datasets:
  - commerce
sampleInput:
  - "customers(id, name, email, city, signup_date)"
  - "products(id, name, category, price, stock)"
  - "orders(id, customer_id, order_date, status)"
  - "order_items(id, order_id, product_id, quantity, unit_price)"
  - "payments(id, order_id, amount, method, paid_at)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: commerce
solutionSql: |
  SELECT DISTINCT c.name FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id WHERE p.category = 'Electronics' ORDER BY c.name
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
