id: "01a08dde-8454-7415-8baa-5b25dee9486e"
slug: "orders-with-more-than-one-item"
title: "Orders with more than one line"
description: |
  order_ids having COUNT(order_items) > 1.
difficulty: easy
mode: read
category: commerce
datasets:
  - commerce
sampleInput:
  - "customers(id, name, email, city, signup_date)"
  - "products(id, name, category, price, stock)"
  - "orders(id, customer_id, order_date, status)"
  - "order_items(id, order_id, product_id, quantity, unit_price)"
  - "payments(id, order_id, amount, method, paid_at)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: commerce
solutionSql: |
  SELECT order_id FROM order_items GROUP BY order_id HAVING COUNT(*) > 1 ORDER BY order_id
validationSql: |
  SELECT 1 AS ok
orderMatters: true
