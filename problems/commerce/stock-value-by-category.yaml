id: "01a08dde-8447-79b0-8294-b9e09ddfc27a"
slug: "stock-value-by-category"
title: "Inventory value by category"
description: |
  Category and SUM(price * stock).
difficulty: medium
mode: read
category: commerce
datasets:
  - commerce
sampleInput:
  - "customers(id, name, email, city, signup_date)"
  - "products(id, name, category, price, stock)"
  - "orders(id, customer_id, order_date, status)"
  - "order_items(id, order_id, product_id, quantity, unit_price)"
  - "payments(id, order_id, amount, method, paid_at)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: commerce
solutionSql: |
  SELECT category, SUM(price * stock) AS stock_value FROM products GROUP BY category ORDER BY stock_value DESC, category
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
