solutionSql: |
  SELECT
    CASE
      WHEN salary < 100000 THEN 'Under-100k'
      WHEN salary <= 125000 THEN '100k-125k'
      ELSE 'Over-125k'
    END AS salary_band,
    COUNT(*) AS count,
    ROUND(COUNT(*) * 100.0 / (SELECT COUNT(*) FROM employees), 2) AS pct_of_total
  FROM employees
  GROUP BY 1 ORDER BY 1;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT
        CASE
          WHEN salary < 100000 THEN 'Under-100k'
          WHEN salary <= 125000 THEN '100k-125k'
          ELSE 'Over-125k'
        END AS salary_band,
        COUNT(*) AS count,
        ROUND(COUNT(*) * 100.0 / (SELECT COUNT(*) FROM employees), 2) AS pct_of_total
      FROM employees GROUP BY 1 ORDER BY 1
    ) user_result
    EXCEPT SELECT 1 FROM (VALUES
      ('100k-125k', 3, 33.33), ('Over-125k', 1, 11.11), ('Under-100k', 5, 55.56)
    ) expected(salary_band, count, pct_of_total)
  ) THEN 1 ELSE 0 END AS correct;
