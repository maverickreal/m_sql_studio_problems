id: "01a08dde-8407-78d1-8945-3ee4e610f867"
slug: "a-letter-grades"
title: "Students who earned an A"
description: |
  Distinct student names with at least one A (not A-).
difficulty: easy
mode: read
category: education
datasets:
  - education
sampleInput:
  - "students(id, name, cohort_year, major)"
  - "courses(id, code, title, credits, dept)"
  - "enrollments(student_id, course_id, term)"
  - "grades(student_id, course_id, term, letter, points)"
  - "instructors(id, name, dept)"
  - "course_instructors(course_id, instructor_id, term)"
sampleOutput: "gold-diff"
initSql: |
  -- Dataset: education
solutionSql: |
  SELECT DISTINCT s.name FROM students s JOIN grades g ON g.student_id = s.id WHERE g.letter = 'A' ORDER BY s.name
validationSql: |
  SELECT 1 AS ok
orderMatters: true
origin: first-party
author: "maverickreal"
license: "CC-BY-4.0"
schema_version: 1
