id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f7b"
slug: "dept-avg-vs-overall-avg"
title: "Departments Above Overall Average Salary"
description: |
  Find departments where the average salary exceeds the overall company average. Use a subquery for the overall average.
difficulty: medium
mode: read
category: subqueries
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "dept_name | avg_salary\n---|---\nEngineering | 133333.33"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT d.name AS dept_name,
    ROUND(AVG(e.salary), 2) AS avg_salary
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  GROUP BY d.name
  HAVING AVG(e.salary) > (SELECT AVG(salary) FROM employees)
  ORDER BY avg_salary DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT d.name AS dept_name,
        ROUND(AVG(e.salary), 2) AS avg_salary
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      GROUP BY d.name
      HAVING AVG(e.salary) > (SELECT AVG(salary) FROM employees)
      ORDER BY avg_salary DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Engineering', 133333.33)
    ) expected(dept_name, avg_salary)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
