id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f6e"
slug: "employees-hired-recently"
title: "Employees Hired After 2021"
description: |
  Find all employees hired after January 1, 2021. Return name, department, hire date, and salary.
difficulty: easy
mode: read
category: subqueries
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | dept_name | hire_date | salary\n---|---|---|---\nBob Smith | Engineering | 2021-03-22 | 120000\nCarol Davis | Engineering | 2021-06-10 | 130000\nEva Martinez | Sales | 2022-02-14 | 95000\nFrank Brown | Sales | 2022-08-30 | 105000\nHenry Taylor | Marketing | 2023-01-12 | 85000"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT e.name, d.name AS dept_name, e.hire_date, e.salary
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  WHERE e.hire_date > '2021-01-01'
  ORDER BY e.hire_date;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e.name, d.name AS dept_name, e.hire_date, e.salary
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      WHERE e.hire_date > '2021-01-01'
      ORDER BY e.hire_date
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Bob Smith', 'Engineering', '2021-03-22', 120000),
        ('Carol Davis', 'Engineering', '2021-06-10', 130000),
        ('Eva Martinez', 'Sales', '2022-02-14', 95000),
        ('Frank Brown', 'Sales', '2022-08-30', 105000),
        ('Henry Taylor', 'Marketing', '2023-01-12', 85000)
    ) expected(name, dept_name, hire_date, salary)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
