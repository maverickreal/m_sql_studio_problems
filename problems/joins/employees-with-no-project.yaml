id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f8a"
slug: "employees-with-no-project"
title: "Employees with no project assignment"
description: |
  Write a query that returns the names of employees who are not assigned to any project.
difficulty: easy
mode: read
category: joins
datasets:
  - hr
sampleInput:
  - "employees(id, name)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "name\nDavid Wilson\nEva Martinez\nFrank Brown\nGrace Lee\nHenry Taylor\nIris Anderson"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
  CREATE TABLE employees (
    id INT PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    dept_id INT NOT NULL,
    salary INT NOT NULL,
    hire_date DATE NOT NULL,
    manager_id INT
  );
  INSERT INTO employees VALUES
    (1, 'Alice Chen', 1, 150000, '2020-01-15', NULL),
    (2, 'Bob Smith', 1, 120000, '2021-03-22', 1),
    (3, 'Carol Davis', 1, 130000, '2021-06-10', 1),
    (4, 'David Wilson', 2, 110000, '2019-11-05', NULL),
    (5, 'Eva Martinez', 2, 95000, '2022-02-14', 4),
    (6, 'Frank Brown', 2, 105000, '2022-08-30', 4),
    (7, 'Grace Lee', 3, 100000, '2021-04-18', NULL),
    (8, 'Henry Taylor', 3, 85000, '2023-01-12', 7),
    (9, 'Iris Anderson', 4, 90000, '2020-09-03', NULL);

  CREATE TABLE employee_projects (
    employee_id INT NOT NULL,
    project_id INT NOT NULL,
    role VARCHAR(50) NOT NULL,
    PRIMARY KEY (employee_id, project_id)
  );
  INSERT INTO employee_projects VALUES
    (1, 1, 'Lead'),
    (2, 1, 'Developer'),
    (3, 1, 'Developer'),
    (2, 2, 'Lead'),
    (4, 3, 'Lead'),
    (5, 3, 'Analyst'),
    (7, 4, 'Lead'),
    (8, 4, 'Designer');
solutionSql: |
  SELECT e.name
  FROM employees e
  LEFT JOIN employee_projects ep ON e.id = ep.employee_id
  WHERE ep.employee_id IS NULL;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e.name
      FROM employees e
      LEFT JOIN employee_projects ep ON e.id = ep.employee_id
      WHERE ep.employee_id IS NULL
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES ('David Wilson'), ('Eva Martinez'), ('Frank Brown'), ('Grace Lee'), ('Henry Taylor'), ('Iris Anderson')
    ) expected(name)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: false
origin: first-party
