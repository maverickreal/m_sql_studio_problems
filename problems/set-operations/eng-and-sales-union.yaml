id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f74"
slug: "eng-and-sales-union"
title: "Engineering and Sales Employees Combined"
description: |
  List all employees who work in either Engineering or Sales department using UNION. Return name, department, and salary.
difficulty: easy
mode: read
category: set-operations
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "employees(id, name, dept_id, salary, hire_date, manager_id)"
sampleOutput: "name | dept_name | salary\n---|---|---\nAlice Chen | Engineering | 150000\nBob Smith | Engineering | 120000\nCarol Davis | Engineering | 130000\nDavid Wilson | Sales | 110000\nEva Martinez | Sales | 95000\nFrank Brown | Sales | 105000"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT e.name, d.name AS dept_name, e.salary
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  WHERE d.name = 'Engineering'
  UNION
  SELECT e.name, d.name AS dept_name, e.salary
  FROM employees e
  JOIN departments d ON e.dept_id = d.id
  WHERE d.name = 'Sales'
  ORDER BY dept_name, salary DESC;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT e.name, d.name AS dept_name, e.salary
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      WHERE d.name = 'Engineering'
      UNION
      SELECT e.name, d.name AS dept_name, e.salary
      FROM employees e
      JOIN departments d ON e.dept_id = d.id
      WHERE d.name = 'Sales'
      ORDER BY dept_name, salary DESC
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
        ('Alice Chen', 'Engineering', 150000),
        ('Bob Smith', 'Engineering', 120000),
        ('Carol Davis', 'Engineering', 130000),
        ('David Wilson', 'Sales', 110000),
        ('Eva Martinez', 'Sales', 95000),
        ('Frank Brown', 'Sales', 105000)
    ) expected(name, dept_name, salary)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
origin: first-party
