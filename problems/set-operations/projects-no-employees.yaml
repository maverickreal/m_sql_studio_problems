id: "0192f0a1-2b3c-7d8e-9f0a-1b2c3d4e5f75"
slug: "projects-no-employees"
title: "Projects With No Employees Assigned"
description: |
  Find projects that have no employees assigned to them using EXCEPT. Return project name and department.
difficulty: easy
mode: read
category: set-operations
datasets:
  - hr
sampleInput:
  - "departments(id, name, location)"
  - "projects(id, name, dept_id, budget)"
  - "employee_projects(employee_id, project_id, role)"
sampleOutput: "project_name | dept_name\n---|---"
initSql: |
  -- Dataset: hr (see datasets/hr/ for schema + seed)
solutionSql: |
  SELECT p.name AS project_name, d.name AS dept_name
  FROM projects p
  JOIN departments d ON p.dept_id = d.id
  EXCEPT
  SELECT p.name AS project_name, d.name AS dept_name
  FROM projects p
  JOIN departments d ON p.dept_id = d.id
  JOIN employee_projects ep ON p.id = ep.project_id
  ORDER BY project_name;
validationSql: |
  SELECT CASE WHEN NOT EXISTS (
    SELECT 1 FROM (
      SELECT p.name AS project_name, d.name AS dept_name
      FROM projects p
      JOIN departments d ON p.dept_id = d.id
      EXCEPT
      SELECT p.name AS project_name, d.name AS dept_name
      FROM projects p
      JOIN departments d ON p.dept_id = d.id
      JOIN employee_projects ep ON p.id = ep.project_id
      ORDER BY project_name
    ) user_result
    EXCEPT
    SELECT 1 FROM (
      VALUES 
    ) expected(project_name, dept_name)
  ) THEN 1 ELSE 0 END AS correct;
orderMatters: true
